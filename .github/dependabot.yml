version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      frontend-runtime:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /design-system
    schedule:
      interval: monthly
    groups:
      marketing-design-system:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /services/races-api
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /pipeline_client
    schedule:
      interval: monthly
