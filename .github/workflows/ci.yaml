name: CI - Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Reject tracked Terraform artifacts
        shell: bash
        run: |
          tracked_artifacts="$(
            git ls-files |
            grep -E '(^|/)(tfplan|[^/]+\.tfplan|terraform\.tfstate(\..*)?|secrets\.tfvars)$' ||
            true
          )"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Generated or sensitive Terraform files must not be committed:"
            echo "$tracked_artifacts"
            exit 1
          fi

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.0 \
            dir --redact --no-banner /repo

  test-pipeline:
    name: Test Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline_client/backend/requirements.txt
          pip install -r services/races-api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run pipeline tests
        run: |
          PYTHONPATH=. python -m pytest tests -v \
            --ignore=tests/test_agent_cloud_function.py \
            --ignore=tests/test_races_api_admin.py

      - name: Check Python formatting
        run: |
          python -m pip install "black==23.11.0" "isort==5.12.0"
          python -m black --check shared smartervote_mcp services/races-api tests pipeline_client functions scripts
          python -m isort --check-only shared smartervote_mcp services/races-api tests pipeline_client functions scripts

  test-apis:
    name: Test API Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Test Races API
        run: |
          cd services/races-api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
          PYTHONPATH=../.. python -m pytest test_races_api.py -v

      - name: Test Races API admin endpoints
        run: |
          cd services/races-api
          PYTHONPATH=../.. python -m pytest ../../tests/test_races_api_admin.py -v

  test-cloud-function:
    name: Test Agent Cloud Function
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline_client/backend/requirements.txt
          pip install -r functions/agent/requirements.txt
          pip install pytest pytest-asyncio cloudevents

      - name: Run Cloud Function tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_agent_cloud_function.py -v

  test-web:
    name: Test Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci

      - name: Type check
        run: |
          cd web && npm run check

      - name: Lint
        run: |
          cd web && npm run lint

      - name: Create mock static data for CI build
        run: |
          mkdir -p web/static
          echo "[]" > web/static/summaries.json
          echo '{"schema_version":"chamber_forecasts.v2","house":"","senate":"","governors":"","chambers":{"house":{"projected_seats":{"Democratic":0,"Republican":0},"tossup_count":0,"competitive_race_count":0},"senate":{"projected_seats":{"Democratic":0,"Republican":0},"tossup_count":0,"competitive_race_count":0},"governors":{"projected_seats":{"Democratic":0,"Republican":0},"tossup_count":0,"competitive_race_count":0}}}' > web/static/chamber_forecasts.json

      - name: Build SvelteKit
        env:
          FAST_BUILD: "true"
        run: |
          cd web && npm run build

      - name: Run unit tests
        run: |
          cd web && npm run test:unit -- --run

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.0

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  quality-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        security,
        test-pipeline,
        test-apis,
        test-cloud-function,
        test-web,
        terraform-validate,
      ]
    if: always()

    steps:
      - name: Check all gates
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          PIPELINE_RESULT: ${{ needs.test-pipeline.result }}
          APIS_RESULT: ${{ needs.test-apis.result }}
          CF_RESULT: ${{ needs.test-cloud-function.result }}
          WEB_RESULT: ${{ needs.test-web.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-validate.result }}
        run: |
          echo "security:            $SECURITY_RESULT"
          echo "test-pipeline:       $PIPELINE_RESULT"
          echo "test-apis:           $APIS_RESULT"
          echo "test-cloud-function: $CF_RESULT"
          echo "test-web:            $WEB_RESULT"
          echo "terraform-validate:  $TERRAFORM_RESULT"
          if [[ "$SECURITY_RESULT" != "success" || "$PIPELINE_RESULT" != "success" || "$APIS_RESULT" != "success" || "$CF_RESULT" != "success" || "$WEB_RESULT" != "success" || "$TERRAFORM_RESULT" != "success" ]]; then
            echo "❌ One or more CI gates failed"
            exit 1
          fi
          echo "✅ All CI gates passed — ready for deployment"
