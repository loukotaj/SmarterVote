name: CI - Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Reject tracked Terraform artifacts
        shell: bash
        run: |
          tracked_artifacts="$(
            git ls-files |
            grep -E '(^|/)(tfplan|[^/]+\.tfplan|terraform\.tfstate(\..*)?|secrets\.tfvars)$' ||
            true
          )"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Generated or sensitive Terraform files must not be committed:"
            echo "$tracked_artifacts"
            exit 1
          fi

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b \
            dir --redact --no-banner /repo

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.0"
          # PYSEC-2026-1325 affects ECDSA signing. Authentication only verifies
          # Auth0 RS256 tokens, and python-jose has no fixed ecdsa dependency yet.
          pip-audit --ignore-vuln PYSEC-2026-1325 -r pipeline_client/backend/requirements.txt
          pip-audit --ignore-vuln PYSEC-2026-1325 -r services/races-api/requirements.txt
          pip-audit -r functions/admin_agent/requirements.txt
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  test-pipeline:
    name: Test Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-constraints.txt -r pipeline_client/backend/requirements.txt
          pip install -c requirements-constraints.txt -r services/races-api/requirements.txt
          pip install -c requirements-constraints.txt pytest pytest-asyncio pytest-cov httpx

      - name: Run pipeline tests
        run: |
          PYTHONPATH=. python -m pytest tests -v \
            --ignore=tests/test_races_api_admin.py \
            --cov=pipeline_client --cov=shared --cov=functions --cov=smartervote_mcp \
            --cov-report=term-missing --cov-fail-under=59

      - name: Check Python formatting
        run: |
          python -m pip install "black==23.11.0" "isort==5.12.0"
          python -m black --check shared smartervote_mcp services/races-api tests pipeline_client functions scripts
          python -m isort --check-only shared smartervote_mcp services/races-api tests pipeline_client functions scripts

  test-apis:
    name: Test API Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Test Races API
        run: |
          cd services/races-api
          python -m pip install --upgrade pip
          pip install -c ../../requirements-constraints.txt -r requirements.txt
          pip install -c ../../requirements-constraints.txt -r test-requirements.txt
          PYTHONPATH=../.. python -m pytest . -v

      - name: Test Races API admin endpoints
        run: |
          cd services/races-api
          PYTHONPATH=../.. python -m pytest ../../tests/test_races_api_admin.py -v

  test-admin-function:
    name: Test Admin Function (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install function dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r functions/admin_agent/requirements.txt
          pip install -c requirements-constraints.txt pytest pytest-asyncio
      - name: Run function tests
        run: PYTHONPATH=. python -m pytest --noconftest tests/test_admin_agent_function.py -v

  test-web:
    name: Test Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci

      - name: Type check
        run: |
          cd web && npm run check

      - name: Lint
        run: |
          cd web && npm run lint

      - name: Create mock static data for CI build
        run: |
          mkdir -p web/static
          echo "[]" > web/static/summaries.json
          echo '{"schema_version":"chamber_forecasts.v2","house":"","senate":"","governors":"","chambers":{"house":{"projected_seats":{"Democratic":0,"Republican":0},"tossup_count":0,"competitive_race_count":0},"senate":{"projected_seats":{"Democratic":0,"Republican":0},"tossup_count":0,"competitive_race_count":0},"governors":{"projected_seats":{"Democratic":0,"Republican":0},"tossup_count":0,"competitive_race_count":0}}}' > web/static/chamber_forecasts.json

      - name: Build SvelteKit
        env:
          FAST_BUILD: "true"
        run: |
          cd web && npm run build

      - name: Install Playwright browser
        run: |
          cd web && npx playwright install --with-deps chromium

      - name: Frontend browser smoke tests
        run: |
          cd web && npm run test:e2e

      - name: Run unit tests
        run: |
          cd web && npm run test:unit -- --run

  test-design-system:
    name: Test Marketing Design System
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - name: Install dependencies
        working-directory: design-system
        run: npm ci
      - name: Audit dependencies
        working-directory: design-system
        run: npm audit --audit-level=high
      - name: Type-check components
        working-directory: design-system
        run: npm run typecheck
      - name: Build Claude marketing export
        working-directory: design-system
        run: npm run build

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.0

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: github/codeql-action/init@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4

  release-artifacts:
    name: Build and Scan Release Containers
    runs-on: ubuntu-latest
    needs: [test-pipeline, test-apis, test-admin-function]
    strategy:
      matrix:
        include:
          - name: races-api
            dockerfile: services/races-api/Dockerfile
          - name: pipeline-worker
            dockerfile: pipeline_client/Dockerfile.worker
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Build ${{ matrix.name }}
        run: docker build --pull -f "${{ matrix.dockerfile }}" -t "smartervote/${{ matrix.name }}:${{ github.sha }}" .
      - name: Smoke test races API image
        if: matrix.name == 'races-api'
        run: docker run --rm "smartervote/${{ matrix.name }}:${{ github.sha }}" python -c "import main"
      - name: Scan ${{ matrix.name }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --scanners vuln --skip-version-check --exit-code 1 --ignore-unfixed --severity CRITICAL \
            "smartervote/${{ matrix.name }}:${{ github.sha }}"
      - name: Export immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "smartervote/${{ matrix.name }}:${{ github.sha }}" | gzip > "${{ matrix.name }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: container-${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  quality-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        security,
        dependency-audit,
        test-pipeline,
        test-apis,
        test-admin-function,
        test-web,
        test-design-system,
        terraform-validate,
        codeql,
        release-artifacts,
      ]
    if: always()

    steps:
      - name: Check all gates
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-audit.result }}
          PIPELINE_RESULT: ${{ needs.test-pipeline.result }}
          APIS_RESULT: ${{ needs.test-apis.result }}
          ADMIN_FUNCTION_RESULT: ${{ needs.test-admin-function.result }}
          WEB_RESULT: ${{ needs.test-web.result }}
          DESIGN_SYSTEM_RESULT: ${{ needs.test-design-system.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-validate.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ARTIFACT_RESULT: ${{ needs.release-artifacts.result }}
        run: |
          echo "security:            $SECURITY_RESULT"
          echo "dependency-audit:    $DEPENDENCY_RESULT"
          echo "test-pipeline:       $PIPELINE_RESULT"
          echo "test-apis:           $APIS_RESULT"
          echo "test-admin-function: $ADMIN_FUNCTION_RESULT"
          echo "test-web:            $WEB_RESULT"
          echo "test-design-system:  $DESIGN_SYSTEM_RESULT"
          echo "terraform-validate:  $TERRAFORM_RESULT"
          echo "codeql:              $CODEQL_RESULT"
          echo "release-artifacts:   $ARTIFACT_RESULT"
          if [[ "$SECURITY_RESULT" != "success" || "$DEPENDENCY_RESULT" != "success" || "$PIPELINE_RESULT" != "success" || "$APIS_RESULT" != "success" || "$ADMIN_FUNCTION_RESULT" != "success" || "$WEB_RESULT" != "success" || "$DESIGN_SYSTEM_RESULT" != "success" || "$TERRAFORM_RESULT" != "success" || "$CODEQL_RESULT" != "success" || "$ARTIFACT_RESULT" != "success" ]]; then
            echo "❌ One or more CI gates failed"
            exit 1
          fi
          echo "✅ All CI gates passed — ready for deployment"
