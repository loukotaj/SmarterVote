name: Deploy Infrastructure

on:
  workflow_run:
    workflows: ["CI - Quality Gates"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev/staging/prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - rollback
      deploy_sha:
        description: "Verified commit SHA to apply or roll back to"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  ACTION: ${{ github.event.inputs.action || 'apply' }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.deploy_sha || github.sha }}
  TF_VAR_app_version: ${{ github.event.workflow_run.head_sha || github.event.inputs.deploy_sha || github.sha }}

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify CI Release
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.release.outputs.ci_run_id }}
      deploy_sha: ${{ steps.release.outputs.deploy_sha }}
    steps:
      - name: Resolve verified release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTOMATIC_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REQUESTED_SHA: ${{ github.event.inputs.deploy_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            [[ "$AUTOMATIC_CONCLUSION" == "success" ]] || { echo "::error::Triggering CI did not succeed"; exit 1; }
            echo "ci_run_id=$AUTOMATIC_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=$AUTOMATIC_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ -n "$REQUESTED_SHA" ]] || { echo "::error::deploy_sha is required for manual releases"; exit 1; }
          full_sha="$(gh api "repos/${{ github.repository }}/commits/$REQUESTED_SHA" --jq .sha)"
          run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?head_sha=$full_sha&status=success&event=push&per_page=20" --jq '.workflow_runs | map(select(.head_branch == "main" and .conclusion == "success")) | first | .id // empty')"
          [[ -n "$run_id" ]] || { echo "::error::No successful main push CI run found for $full_sha"; exit 1; }
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$full_sha" >> "$GITHUB_OUTPUT"

  publish-containers:
    name: Publish Verified Container Images
    runs-on: ubuntu-latest
    needs: verify-release
    if: ${{ github.event_name == 'workflow_run' || github.event.inputs.action == 'apply' }}
    environment: ${{ github.event.inputs.environment || 'dev' }}
    strategy:
      matrix:
        container:
          - name: races-api
          - name: pipeline-worker
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: container-${{ matrix.container.name }}
          run-id: ${{ needs.verify-release.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Authenticate to Google Cloud with OIDC
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with legacy key
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe smartervote-${{ env.ENVIRONMENT }} \
               --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
            echo "Creating Artifact Registry repository smartervote-${{ env.ENVIRONMENT }}..."
            gcloud artifacts repositories create smartervote-${{ env.ENVIRONMENT }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --description="SmarterVote container images for ${{ env.ENVIRONMENT }} environment"
          else
            echo "Artifact Registry repository smartervote-${{ env.ENVIRONMENT }} already exists."
          fi

      - name: Load and Push ${{ matrix.container.name }}
        run: |
          gunzip -c "${{ matrix.container.name }}.tar.gz" | docker load
          source_image="smartervote/${{ matrix.container.name }}:${{ needs.verify-release.outputs.deploy_sha }}"
          release_image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/smartervote-${{ env.ENVIRONMENT }}/${{ matrix.container.name }}:${{ needs.verify-release.outputs.deploy_sha }}"
          docker tag "$source_image" "$release_image"
          docker push "$release_image"

  deploy-terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [verify-release, publish-containers]
    if: ${{ always() && needs.verify-release.result == 'success' && (needs.publish-containers.result == 'success' || needs.publish-containers.result == 'skipped') }}
    environment: ${{ github.event.inputs.environment || 'dev' }}
    # Pass all Terraform variables as TF_VAR_* env vars to avoid writing secrets into a
    # shell heredoc (backticks/special chars in secret values cause bad-substitution errors).
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: us-central1
      TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
      TF_VAR_app_version: ${{ needs.verify-release.outputs.deploy_sha }}
      TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      TF_VAR_serper_api_key: ${{ secrets.SERPER_API_KEY }}
      TF_VAR_searlo_api_key: ${{ secrets.SEARLO_API_KEY }}
      TF_VAR_admin_api_key: ${{ secrets.ADMIN_API_KEY }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_auth0_domain: ${{ vars.AUTH0_DOMAIN }}
      TF_VAR_auth0_audience: ${{ vars.AUTH0_AUDIENCE }}
      TF_VAR_cloudflare_analytics_api_token: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      TF_VAR_cloudflare_analytics_account_tag: ${{ vars.CLOUDFLARE_ANALYTICS_ACCOUNT_TAG }}
      TF_VAR_cloudflare_analytics_site_tag: ${{ vars.CLOUDFLARE_ANALYTICS_SITE_TAG }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.verify-release.outputs.deploy_sha }}

      - name: Validate required secrets
        env:
          REQUIRED_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REQUIRED_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          REQUIRED_GCP_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          REQUIRED_GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          REQUIRED_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUIRED_SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          REQUIRED_SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          REQUIRED_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          REQUIRED_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          REQUIRED_ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          REQUIRED_CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          REQUIRED_CLOUDFLARE_ANALYTICS_ACCOUNT_TAG: ${{ vars.CLOUDFLARE_ANALYTICS_ACCOUNT_TAG }}
          REQUIRED_CLOUDFLARE_ANALYTICS_SITE_TAG: ${{ vars.CLOUDFLARE_ANALYTICS_SITE_TAG }}
        run: |
          MISSING=()
          [ -z "$REQUIRED_GCP_PROJECT_ID" ]    && MISSING+=("GCP_PROJECT_ID")
          if [ -z "$REQUIRED_GCP_SA_KEY" ] && { [ -z "$REQUIRED_GCP_WIF_PROVIDER" ] || [ -z "$REQUIRED_GCP_DEPLOY_SA" ]; }; then
            MISSING+=("GCP authentication: configure both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT, or GCP_SA_KEY during migration")
          fi
          [ -z "$REQUIRED_OPENROUTER_API_KEY" ] && MISSING+=("OPENROUTER_API_KEY")
          [ -z "$REQUIRED_SERPER_API_KEY" ]    && MISSING+=("SERPER_API_KEY")
          [ -z "$REQUIRED_SEARLO_API_KEY" ]    && MISSING+=("SEARLO_API_KEY")
          [ -z "$REQUIRED_AUTH0_DOMAIN" ]      && MISSING+=("AUTH0_DOMAIN")
          [ -z "$REQUIRED_AUTH0_AUDIENCE" ]    && MISSING+=("AUTH0_AUDIENCE")
          [ -z "$REQUIRED_ADMIN_API_KEY" ]      && MISSING+=("ADMIN_API_KEY")
          [ -z "$REQUIRED_CLOUDFLARE_ANALYTICS_API_TOKEN" ] && MISSING+=("CLOUDFLARE_ANALYTICS_API_TOKEN")
          [ -z "$REQUIRED_CLOUDFLARE_ANALYTICS_ACCOUNT_TAG" ] && MISSING+=("CLOUDFLARE_ANALYTICS_ACCOUNT_TAG")
          [ -z "$REQUIRED_CLOUDFLARE_ANALYTICS_SITE_TAG" ] && MISSING+=("CLOUDFLARE_ANALYTICS_SITE_TAG")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::Required GitHub secrets are missing: ${MISSING[*]}"
            echo "These secrets must be set in GitHub repo settings before deploying."
            echo "Missing secrets would cause Cloud Run services to start without"
            echo "required env vars, leading to silent fallbacks or crashes."
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.0

      - name: Authenticate to Google Cloud with OIDC
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with legacy key
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Sync API keys to Secret Manager
        if: env.ACTION == 'apply' || github.event_name != 'workflow_dispatch'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: |
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Skipping $name (not set)"
              return
            fi
            if ! gcloud secrets describe "$name" --project=${{ env.PROJECT_ID }} >/dev/null 2>&1; then
              echo "$name does not exist yet; Terraform will create it"
              return
            fi
            # Get the current latest value and compare
            current=$(gcloud secrets versions access latest --secret="$name" --project=${{ env.PROJECT_ID }} 2>/dev/null || echo "")
            if [ "$current" = "$value" ]; then
              echo "$name is already up to date"
            else
              echo "Updating $name..."
              echo -n "$value" | gcloud secrets versions add "$name" --data-file=- --project=${{ env.PROJECT_ID }}
            fi
          }
          sync_secret "openrouter-api-key-${{ env.ENVIRONMENT }}" "$OPENROUTER_API_KEY"
          sync_secret "serper-api-key-${{ env.ENVIRONMENT }}"   "$SERPER_API_KEY"
          sync_secret "searlo-api-key-${{ env.ENVIRONMENT }}"   "$SEARLO_API_KEY"
          sync_secret "races-api-admin-key-${{ env.ENVIRONMENT }}" "$ADMIN_API_KEY"
          sync_secret "stripe-secret-key-${{ env.ENVIRONMENT }}" "$STRIPE_SECRET_KEY"
          sync_secret "stripe-webhook-secret-${{ env.ENVIRONMENT }}" "$STRIPE_WEBHOOK_SECRET"
          sync_secret "cloudflare-analytics-api-token-${{ env.ENVIRONMENT }}" "$CLOUDFLARE_ANALYTICS_API_TOKEN"

      - name: Check if state bucket exists
        run: |
          if ! gsutil ls -b gs://smartervote-terraform-state >/dev/null 2>&1; then
            echo "Creating Terraform state bucket..."
            gsutil mb -p ${{ env.PROJECT_ID }} -l ${{ env.REGION }} gs://smartervote-terraform-state
            gsutil versioning set on gs://smartervote-terraform-state
          fi

      - name: Diagnose IAM identity and permissions
        run: |
          echo "=== Active identity ==="
          gcloud auth list

          ACTIVE=$(gcloud auth list --filter=status:ACTIVE --format="value(account)")
          echo "Active account: $ACTIVE"

          echo ""
          echo "=== IAM roles bound to active account ==="
          gcloud projects get-iam-policy ${{ env.PROJECT_ID }} \
            --flatten="bindings[].members" \
            --filter="bindings.members:$ACTIVE" \
            --format="table(bindings.role)"

      - name: Build Admin Agent Function source zip
        run: |
          STAGING=$(mktemp -d)
          cp functions/admin_agent/main.py "$STAGING/"
          cp functions/admin_agent/requirements.txt "$STAGING/"
          (cd "$STAGING" && zip -qr "$GITHUB_WORKSPACE/infra/functions-admin-agent-source.zip" .)
          rm -rf "$STAGING"
          echo "Admin agent function source zip built"

      - name: Terraform Init
        run: |
          cd infra
          terraform init -reconfigure

      - name: Terraform Validate
        run: |
          cd infra
          terraform validate

      - name: Terraform Plan
        if: env.ACTION != 'rollback'
        run: |
          cd infra
          terraform plan -out=tfplan
          terraform show -no-color tfplan > ../terraform-plan.txt

      - name: Upload Plan Artifact
        if: env.ACTION == 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}
          path: terraform-plan.txt
          retention-days: 30

      - name: Terraform Apply
        if: env.ACTION == 'apply'
        run: |
          cd infra
          terraform apply -auto-approve tfplan

      - name: Manual Rollback
        if: env.ACTION == 'rollback'
        run: |
          cd infra
          echo "Applying verified rollback release ${{ needs.verify-release.outputs.deploy_sha }}"
          terraform plan -out=rollback-plan
          terraform apply -auto-approve rollback-plan

      - name: Verify deployed API
        if: env.ACTION == 'apply' || env.ACTION == 'rollback'
        run: |
          set -euo pipefail
          api_url="$(terraform -chdir=infra output -raw races_api_url)"
          for path in /health /health/ready; do
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 15 "$api_url$path"; then
                echo
                break
              fi
              if [[ "$attempt" == 12 ]]; then
                echo "::error::Deployment verification failed for $api_url$path"
                exit 1
              fi
              sleep 10
            done
          done

      - name: Output Infrastructure Summary
        if: always()
        env:
          SUMMARY_ACTION: ${{ env.ACTION }}
          SUMMARY_ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SUMMARY_PROJECT: ${{ env.PROJECT_ID }}
          SUMMARY_REGION: ${{ env.REGION }}
          SUMMARY_VERSION: ${{ env.TF_VAR_app_version }}
        run: |
          {
            echo "## 🚀 SmarterVote Infrastructure Deployment"
            echo "- **Environment**: $SUMMARY_ENVIRONMENT"
            echo "- **Action**: $SUMMARY_ACTION"
            echo "- **Project**: $SUMMARY_PROJECT"
            echo "- **Region**: $SUMMARY_REGION"
            echo "- **Version**: $SUMMARY_VERSION"
            echo "- **Timestamp**: $(date -u)"
            echo
            echo "### 🔗 Quick Links"
            echo "- [GCP Console](https://console.cloud.google.com/home/dashboard?project=$SUMMARY_PROJECT)"
            echo "- [Cloud Run Services](https://console.cloud.google.com/run?project=$SUMMARY_PROJECT)"
            echo "- [Storage Buckets](https://console.cloud.google.com/storage/browser?project=$SUMMARY_PROJECT)"
            echo "- [Terraform State](https://console.cloud.google.com/storage/browser/smartervote-terraform-state?project=$SUMMARY_PROJECT)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up secrets
        run: |
          cd infra
          rm -f github-actions.tfvars
