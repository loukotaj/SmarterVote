name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI - Quality Gates"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DEFAULT_RACES_API_URL: https://races-api-dev-ddsvfazica-uc.a.run.app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    env:
      INDEXNOW_KEY_CONFIGURED: ${{ secrets.INDEXNOW_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Fetch latest static data from GCS/API
        env:
          RACES_API_URL: ${{ vars.RACES_API_URL }}
          VITE_PUBLIC_DATA_URL: ${{ vars.VITE_PUBLIC_DATA_URL }}
        run: |
          set -euo pipefail
          mkdir -p data/published
          if [[ -n "${VITE_PUBLIC_DATA_URL:-}" ]]; then
            DATA_URL="${VITE_PUBLIC_DATA_URL%/}"
            curl -sSfL "$DATA_URL/summaries.json" -o data/published/summaries.json
            curl -sSfL "$DATA_URL/chamber_forecasts.json" -o data/published/chamber_forecasts.json
          elif [[ -n "${RACES_API_URL:-}" ]]; then
            API_URL="${RACES_API_URL%/}"
            curl -sSfL "$API_URL/races/summaries" -o data/published/summaries.json
            curl -sSfL "$API_URL/races/chamber_forecasts" -o data/published/chamber_forecasts.json
          else
            echo "Warning: VITE_PUBLIC_DATA_URL and RACES_API_URL are empty. Falling back to dev GCS bucket."
            DATA_URL="https://storage.googleapis.com/smartervote-sv-data-dev"
            curl -sSfL "$DATA_URL/races/summaries.json" -o data/published/summaries.json
            curl -sSfL "$DATA_URL/races/chamber_forecasts.json" -o data/published/chamber_forecasts.json
          fi

      - name: Generate SvelteKit files
        run: npx svelte-kit sync
        working-directory: web

      - name: Type check
        run: npm run check
        working-directory: web

      - name: Build site
        run: npm run build:cloudflare
        working-directory: web
        env:
          NODE_ENV: production
          VITE_RACES_API_URL: ${{ vars.RACES_API_URL || env.DEFAULT_RACES_API_URL }}
          VITE_PUBLIC_DATA_URL: ${{ vars.VITE_PUBLIC_DATA_URL }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}

      - name: Add IndexNow key file
        if: ${{ env.INDEXNOW_KEY_CONFIGURED == 'true' }}
        run: |
          set -euo pipefail
          printf '%s' "$INDEXNOW_KEY" > "build/${INDEXNOW_KEY}.txt"
        working-directory: web
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Create Pages Project if not exists
        run: npx wrangler pages project create ${{ vars.CLOUDFLARE_PROJECT_NAME || 'smartervote-web' }} --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'b9e75903377dcca73a27a5d6be4e4384' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'b9e75903377dcca73a27a5d6be4e4384' }}
          command: pages deploy web/build --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'smartervote-web' }} --branch=main

      - name: Submit sitemap URLs to IndexNow
        if: ${{ env.INDEXNOW_KEY_CONFIGURED == 'true' }}
        run: npm run submit:indexnow
        working-directory: web
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
