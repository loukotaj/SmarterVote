name: Pipeline Tests

# Run manually or on schedule
on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: "0 2 * * 1" # Weekly on Mondays at 2 AM UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-pipeline:
    name: Scheduled Pipeline Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline_client/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-constraints.txt -r pipeline_client/backend/requirements.txt
          pip install -c requirements-constraints.txt -r services/races-api/requirements.txt
          pip install -c requirements-constraints.txt pytest pytest-asyncio httpx

      - name: Run pipeline tests
        run: |
          PYTHONPATH=. python -m pytest \
            tests/test_agent_loop.py \
            tests/test_pipeline_steps.py \
            tests/test_queue_worker.py \
            -v --tb=short
      - name: Test summary
        run: |
          echo "✅ Pipeline tests completed"
          echo "🧪 Agent loop, prompts, JSON extraction, multi-phase orchestration tested"
