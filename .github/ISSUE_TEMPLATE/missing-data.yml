name: Missing Candidate Data
description: Report missing or incomplete information for a candidate we already cover
title: "[Data] Missing data for: "
labels: ["data-request", "community-contribution"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SmarterVote! Candidate data is produced by an automated research
        pipeline, so a good report here turns directly into a targeted re-run.

        Before filing, please:
        - Confirm the gap is still visible on the live page — data refreshes continuously.
        - [Search existing data reports](https://github.com/SmarterVote/SmarterVote/issues?q=is%3Aissue+label%3Adata-request) to avoid duplicates.
        - Use the [Race Request](https://github.com/SmarterVote/SmarterVote/issues/new?template=race-request.yml) template instead if we don't cover the race at all.

  - type: input
    id: race-id
    attributes:
      label: Race ID
      description: >
        The last part of the race's URL — `https://smarter.vote/races/`**`pa-senate-2026`**.
        Format is `state-office-year`; U.S. House districts are zero-padded (`al-house-01-2026`).
      placeholder: pa-senate-2026
    validations:
      required: true

  - type: input
    id: candidate-name
    attributes:
      label: Candidate Name
      description: Spell it as it appears on the ballot or the candidate's own site.
      placeholder: Jane Smith
    validations:
      required: true

  - type: checkboxes
    id: data-type
    attributes:
      label: What type of data is missing?
      description: Select all that apply
      options:
        - label: Issue stances / positions
        - label: Donor information
        - label: Voting record
        - label: Biographical information
        - label: Campaign website
        - label: Other

  - type: textarea
    id: source-url
    attributes:
      label: Source URL(s)
      description: |
        Links to reliable sources where we can find this information. Primary sources work best:
        the official campaign site, FEC filings, Congress.gov voting records, or established news outlets.

        Please don't rely on social media posts or partisan advocacy sites as the only source.
      placeholder: |
        - https://candidatewebsite.com/issues
        - https://www.fec.gov/data/candidate/H0PA01234/
        - https://newssite.com/article-about-candidate
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Anything that helps us find and verify this data.

        Note: we track a fixed set of 12 policy issues — Healthcare, Economy, Climate/Energy,
        Abortion & Reproductive Health, Immigration, Firearms & Second Amendment, Foreign Policy,
        Civil Rights & Equality, Education, Tech & AI, Election Policy, and Local Issues. If the
        stance you have in mind falls outside those, mention it here.
      placeholder: The candidate spoke about healthcare policy at a town hall on March 15...

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Please confirm the following
      options:
        - label: I have verified that this source is reliable (official campaign, established news outlet, government database)
          required: true
        - label: The information is current and relevant to the specified race
          required: true
