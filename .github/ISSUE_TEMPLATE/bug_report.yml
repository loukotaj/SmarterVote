name: Bug Report
description: Report something broken in the site, API, or pipeline
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. Please [search existing issues](https://github.com/SmarterVote/SmarterVote/issues?q=is%3Aissue+label%3Abug) first to avoid duplicates.

        **Reporting missing or wrong candidate data?** That is not a bug — use the
        [Missing Candidate Data](https://github.com/SmarterVote/SmarterVote/issues/new?template=missing-data.yml)
        template instead so it routes to the research pipeline.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: |
        I opened the compare view for two candidates and the page stayed blank.
        I expected a side-by-side table of their issue stances.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of SmarterVote is affected? Pick "Not sure" if you cannot tell.
      options:
        - Public site (web/)
        - Races API (services/races-api/)
        - Research pipeline (pipeline_client/)
        - Infrastructure / deployment (infra/)
        - Documentation (docs/)
        - Not sure
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Page or endpoint
      description: The URL where you hit this, if applicable.
      placeholder: https://smarter.vote/races/pa-senate-2026

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the problem.
      placeholder: |
        1. Go to https://smarter.vote/races/pa-senate-2026
        2. Click "Compare candidates"
        3. Select two candidates
        4. The table never renders

  - type: textarea
    id: logs
    attributes:
      label: Relevant log or console output
      description: Browser console errors, API responses, or pipeline logs. Automatically formatted as code — no backticks needed.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this bug hasn't been reported yet
          required: true
        - label: This is a defect in how the site or pipeline behaves, not missing candidate data
          required: true
