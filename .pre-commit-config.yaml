# Pre-commit hooks for SmarterVote
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml

  # black and isort are pinned to the versions .github/workflows/ci.yaml
  # installs. A hook that formats with a newer release than the gate validates
  # with produces the one outcome a pre-commit hook must not: a file the hook
  # just rewrote, that CI then rejects.
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3
        files: ^(pipeline_client|services|scripts|shared|smartervote_mcp|tests)/.*\.py$
        stages: [manual]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^(pipeline_client|services|scripts|shared|smartervote_mcp|tests)/.*\.py$
        stages: [manual]
