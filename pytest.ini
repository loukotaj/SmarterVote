[pytest]
testpaths =
    tests
    services/races-api
python_files =
    test_*.py
    *_test.py
norecursedirs =
    scripts
    web
    infra
    data
    .venv
    .tmp_cf_staging
markers =
    real_adjudication_gate: opt out of the permissive adjudication stub and see production fail-closed behaviour
