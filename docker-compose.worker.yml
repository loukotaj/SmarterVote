# Local pipeline worker — runs races tagged runner="local" end-to-end. It is a
# permanent first-class alternative to the default one-shot Cloud Run Job runner.
#
# Setup:
#   1. Run `gcloud auth application-default login` on the host (uses your own GCP
#      identity — no static service-account key needed). This writes ADC to
#      %APPDATA%\gcloud\application_default_credentials.json (Windows) or
#      ~/.config/gcloud/application_default_credentials.json (Linux/Mac); the
#      volume mount below covers the Windows path.
#   2. Ensure ./.env has the LLM/search API keys the agent needs (OpenRouter, Serper)
#      and GCS_BUCKET_NAME / GOOGLE_CLOUD_PROJECT for the target (dev) environment.
#   3. docker compose -f docker-compose.worker.yml up --build
#
# To route work here:  run_race(<race_id>, runner="local")  (via the MCP tool / admin API)
services:
  pipeline-worker:
    build:
      context: .
      dockerfile: pipeline_client/Dockerfile.worker
    env_file:
      - .env
    environment:
      PIPELINE_MODE: gcp
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud-config/application_default_credentials.json
      WORKER_CONCURRENCY: "2"
      WORKER_POLL_SECONDS: "3"
      # GCS_BUCKET / FIRESTORE_PROJECT come from .env; override here if needed.
    volumes:
      - ${APPDATA}/gcloud:/gcloud-config:ro
    restart: unless-stopped
    # Active research commonly exceeds two hours. SIGTERM stops new leases and
    # lets in-flight races checkpoint/finish; do not force-kill them after 120s.
    stop_grace_period: 3h
