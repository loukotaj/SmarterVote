<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Dark mode inline detection (fixes mobile blank screen / theme flash) -->
    <script>
      (function () {
        let enabled = false;
        try {
          const saved = localStorage.getItem("darkMode");
          if (saved !== null) {
            enabled = saved === "true";
          } else {
            enabled = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
        } catch (e) {
          try {
            enabled = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (err) {}
        }
        try {
          if (enabled) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Global SEO defaults (page-specific tags are set in each page's svelte:head) -->
    <meta name="author" content="Smarter.vote" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Smarter.vote",
        "url": "https://smarter.vote",
        "description": "Candidate research tool for informed voting decisions, using publicly available sources",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://smarter.vote/elections/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-gray-50 text-gray-900">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
